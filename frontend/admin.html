<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月光塔罗 · 站长后台</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .admin{max-width:860px;margin:0 auto;padding:24px 16px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
  .stat{background:rgba(20,16,40,.72);border:1px solid rgba(212,175,55,.35);border-radius:12px;padding:14px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--gold)}
  .stat span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
  th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(212,175,55,.15);vertical-align:top}
  th{color:var(--gold);font-weight:600}
  td{color:#e8e4f5}
  .token-row{display:flex;gap:8px;margin:12px 0}
  .token-row input{flex:1;background:rgba(20,16,40,.8);border:1px solid rgba(212,175,55,.4);
    border-radius:10px;color:#fff;padding:10px 12px;font-size:14px}
  h2{color:var(--gold-soft);margin-top:28px}
  .warn{color:#e88}
</style>
</head>
<body>
<div class="stars"></div>
<div class="admin">
  <h1>🌙 站长后台</h1>
  <p class="hint">只有你知道密码（.env 里的 ADMIN_TOKEN）。不要把这个页面告诉访客。</p>
  <div class="token-row">
    <input id="token" type="password" placeholder="输入 ADMIN_TOKEN" />
    <button id="load" class="cta" style="margin-top:0">查看数据</button>
  </div>
  <p id="err" class="warn" hidden></p>

  <div id="dashboard" hidden>
    <h2>📊 总览</h2>
    <div class="stat-grid" id="stats"></div>

    <h2>🔮 最新解读</h2>
    <table><thead><tr><th>时间</th><th>用户</th><th>问题</th><th>牌阵</th></tr></thead>
    <tbody id="readings"></tbody></table>

    <h2>👥 最近活跃用户</h2>
    <table><thead><tr><th>用户</th><th>首次来访</th><th>最后活跃</th><th>解读总数</th><th>付费剩余</th></tr></thead>
    <tbody id="users"></tbody></table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("load").addEventListener("click", async () => {
  const token = $("token").value.trim();
  if (!token) { $("err").hidden = false; $("err").textContent = "请先输入 ADMIN_TOKEN。"; return; }
  $("err").hidden = true;
  try {
    const [s, r] = await Promise.all([
      fetch("/api/admin/stats?token=" + encodeURIComponent(token)).then((x) => x.json()),
      fetch("/api/admin/recent?token=" + encodeURIComponent(token)).then((x) => x.json()),
    ]);
    if (s.error) throw new Error(s.error);
    $("dashboard").hidden = false;
    $("stats").innerHTML = [
      ["总用户", s.usersTotal], ["今日新用户", s.usersToday],
      ["总解读", s.readingsTotal], ["今日解读", s.readingsToday],
      ["待支付订单", s.ordersPending], ["已支付订单", s.ordersPaid],
      ["总收入 ¥", s.revenueCny],
    ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
    $("readings").innerHTML = (r.readings || []).map((x) =>
      `<tr><td>${esc(x.created_at.slice(0, 16).replace("T", " "))}</td>` +
      `<td>${esc(x.user_id.slice(0, 8))}</td><td>${esc(x.question)}</td>` +
      `<td>${esc(x.spread || "")}</td></tr>`).join("");
    $("users").innerHTML = (r.users || []).map((u) =>
      `<tr><td>${esc(u.short_id)}</td><td>${esc(u.created_at.slice(0, 16).replace("T", " "))}</td>` +
      `<td>${esc(u.last_seen_at.slice(0, 16).replace("T", " "))}</td>` +
      `<td>${esc(u.readings_total)}</td><td>${esc(u.paid_readings)}</td></tr>`).join("");
  } catch (e) {
    $("err").hidden = false;
    $("err").textContent = "读取失败：密码不对，或服务器没启动。" + e.message;
  }
});
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("load").click(); });
</script>
</body>
</html>
